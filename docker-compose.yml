services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: fontoura_desenvolvimento
    env_file:
      - .env
    volumes:
      - ./:/var/www
    working_dir: /var/www
    depends_on:
      - db
    networks:
      - intra_network
    ports:
      - "${APP_PORT:-8132}:${APP_PORT:-8132}"

  web:
    image: nginx:latest
    container_name: fontoura_desenvolvimento_nginx
    ports:
      - "${WEB_PORT:-8092}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - intra_network

  db:
    image: mysql:8.0
    container_name: fontoura_desenvolvimento_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fontoura_desenvolvimento}
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "${DB_FORWARD_PORT:-3322}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - intra_network

  frontend:
      image: node:20
      container_name: fontoura_desenvolvimento_frontend
      working_dir: /var/www
      volumes:
          - ./:/var/www
      command: sh -c "npm install && npm run dev"
      ports:
          - "${VITE_PORT:-5185}:${VITE_PORT:-5185}" # porta padrão do Vite
      networks:
          - intra_network
      depends_on:
          - app

volumes:
  db_data:

networks:
  intra_network:
    driver: bridge
